services:
  - type: web
    name: easypdf-frontend
    runtime: static
    # This is a pre-generated static site. Do not run tools/build_pages.py during
    # deployment: it regenerates pages and can overwrite hand-maintained content.
    # Omitting buildCommand lets Render publish the checked-in files as-is.
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600
