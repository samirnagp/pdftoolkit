<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDFKit – Offline</title>
<style>
:root{--bg:#fafaf7;--tx:#1c1b1a;--mu:#6b6862;--ac:#d9480f}
@media (prefers-color-scheme:dark){:root{--bg:#161514;--tx:#f1efea;--mu:#a09b92;--ac:#ff8a4c}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px}
h1{margin:0 0 8px}p{color:var(--mu);margin:0 0 20px}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 22px;font:600 15px inherit;cursor:pointer}
</style></head>
<body><main><h1>You are offline</h1>
<p>Check your connection and try again.</p>
<button onclick="location.reload()">Retry</button></main></body></html>
