name: EasyPDF frontend smoke
on:
  push:
    branches:
      - main
      - easypdf-upgrade-2026-11
  pull_request:
    branches:
      - main
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run static site smoke checks
        run: python3 tests/smoke_test.py
